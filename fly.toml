app = "dokdo-marine-monitor"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
